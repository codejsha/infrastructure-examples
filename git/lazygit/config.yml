git:
  allBranchesLogCmds:
    - git log --graph --all --oneline --date-order --color=always --decorate
    - git log --graph --all --date-order --color=always --abbrev-commit --decorate --date=relative --pretty=medium
    - git log --graph --all --date-order --color=always --format="%C(auto)%h %C(bold yellow)%G?%C(reset) %d %s %C(blue)%an %C(green)%cr"
  diffRenderers:
    - command: delta --dark --paging=never
  log:
    order: date-order
    showGraph: always
    showWholeGraph: true
  overrideGpg: true
os:
  editPreset: "nvim"
gui:
  theme:
    selectedLineBgColor:
      - reverse
  branchColorPatterns:
    "^feature/": "#11aaff"
    "^hotfix/": "#ff5733"
  nerdFontsVersion: "3"
  showRandomTip: false
  showBottomLine: false
promptToReturnFromSubprocess: false
customCommands:
  - key: '<c-g>'
    context: 'global'
    description: 'Open gh dash'
    output: terminal
    command: '[ -n "$TMUX" ] && tmux new-window -n gh-dash "gh dash" || gh dash'
